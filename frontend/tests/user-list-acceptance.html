<!doctype html>
<html lang="en"><meta charset="UTF-8"><title>User List pagination checks</title>
<style>body{font:16px system-ui;margin:24px;background:#f7f4ef;color:#222}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999;margin-top:20px}</style>
<h1>User List pagination checks</h1><details><summary>Results</summary><pre id="results">Running…</pre></details><div id="frames"></div>
<script type="module">
const selected=Number(new URLSearchParams(location.search).get('width'));
const sizes=[[1440,900],[1366,650],[768,1024],[390,844],[320,568]].filter(size=>!selected||size[0]===selected);
const results=[];
for(const [width,height] of sizes){
 const frame=document.createElement('iframe');frame.width=width;frame.height=height;
 const result=new Promise(resolve=>{
  const timeout=setTimeout(()=>resolve({viewport:width+'x'+height,error:'Timed out'}),25000);
  function receive(event){if(event.source===frame.contentWindow&&event.data.kind==='user-list-acceptance'){clearTimeout(timeout);removeEventListener('message',receive);resolve(event.data)}}
  addEventListener('message',receive);
 });
 frame.src='./user-list-acceptance-frame.html';document.querySelector('#frames').append(frame);
 results.push(await result);document.querySelector('#results').textContent=JSON.stringify(results,null,2);
}
document.title=results.some(r=>r.error)?'FAIL: User List checks':'Completed: User List checks';
</script></html>
